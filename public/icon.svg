<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Tile -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Outer Sacred Ring -->
  <circle cx="256" cy="256" r="215" stroke="url(#goldGrad)" stroke-width="6" fill="none" stroke-dasharray="14 10" opacity="0.45" />
  <circle cx="256" cy="256" r="190" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.3" />

  <!-- Center Trishul & Damru -->
  <g transform="translate(0, -10)">
    <!-- Center Trident Spear -->
    <path d="M256 55 L285 170 H227 Z" fill="url(#goldGrad)" />
    <path d="M256 170 V420" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" />

    <!-- Left Prong -->
    <path d="M150 145 C150 255 240 285 240 285" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" fill="none" />
    <path d="M135 130 L165 175 H120 Z" fill="url(#goldGrad)" />

    <!-- Right Prong -->
    <path d="M362 145 C362 255 272 285 272 285" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" fill="none" />
    <path d="M377 130 L392 175 H347 Z" fill="url(#goldGrad)" />

    <!-- Damru Waist -->
    <path d="M210 320 L302 385 M302 320 L210 385" stroke="#fef3c7" stroke-width="16" stroke-linecap="round" />
    <circle cx="256" cy="352" r="14" fill="#fde68a" />
  </g>
</svg>
